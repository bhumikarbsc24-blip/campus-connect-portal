<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="heading">My To-Do List</h1>
        <p>Manage your daily tasks easily</p>
    </header>

    <main>

        <section>
            <h2>Add a Task</h2>

            <input type="text" id="taskInput" placeholder="Enter a task">
            <button id="addBtn">Add Task</button>

            <p id="message">Enter a task above.</p>
        </section>

        <section>
            <h2>Tasks</h2>

            <ul id="taskList"></ul>
        </section>

        <section>
            <h2>Keyboard Event</h2>

            <input type="text" id="keyInput" placeholder="Press any key">
            <p id="keyOutput">Your key will appear here.</p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My To-Do List</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
